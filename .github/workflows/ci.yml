name: Test auction modules
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  module-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build selected application with required reactor modules
        run: mvn -B -ntp -pl ${{ matrix.app }} -am clean verify
  full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp clean verify
      - run: python3 scripts/check_architecture.py
      - run: python3 scripts/check_coverage.py
      - run: python3 scripts/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auction-validation
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/
            **/target/checkstyle-result.xml
            client/target/screenshots/
            server/target/server-1.0-SNAPSHOT-all.jar
