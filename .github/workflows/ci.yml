name: Build, test and coverage
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run domain, socket and headless JavaFX tests
        run: mvn -B -ntp clean verify
      - name: Enforce aggregate line coverage including GUI
        run: python3 scripts/check_coverage.py
      - name: Verify packaged server and process restart
        run: python3 scripts/smoke.py
      - name: Upload reports, screenshots and runnable server
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auction-system-validation
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/
            **/target/checkstyle-result.xml
            client/target/screenshots/
            server/target/server-1.0-SNAPSHOT.jar
